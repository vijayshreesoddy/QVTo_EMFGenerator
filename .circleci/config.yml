# This config was automatically generated from your source code
# Stacks detected: deps:java:com.uni.de.qvto.target
version: 2.1
jobs:
  Build_QVToProfilerProduct:
    docker:
      - image: cimg/openjdk:8.0
    working_directory: ~/project/com.uni.de.qvto.parent
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Calculate cache key
          command: |-
            find . -name 'pom.xml' -o -name 'gradlew*' -o -name '*.gradle*' | \
                    sort | xargs cat > /tmp/CIRCLECI_CACHE_KEY
      - restore_cache:
          key: cache-{{ checksum "/tmp/CIRCLECI_CACHE_KEY" }}
      - run:
          command: mvn clean install -U
      - save_cache:
          key: cache-{{ checksum "/tmp/CIRCLECI_CACHE_KEY" }}
          paths:
            - ~/.m2/repository
      - store_artifacts:
          path: ~/project/com.uni.de.qvto.mice.product/target/products/com.uni.de.qvto.product-macosx.cocoa.x86_64.tar.gz
          destination: QVTo_Profiler
workflows:
  build-and-test:
    jobs:
      - Build_QVToProfilerProduct
